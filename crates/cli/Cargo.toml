[package]
name = "r-lancli"
version = "0.12.0"
edition.workspace = true
description = "A command-line interface for performing network scanning operations on local area networks (LANs)"
documentation = "https://docs.rs/r-lancli"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "target/{ target }/release/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.cargo-machete]
ignored = ["prettytable-rs"]

[dependencies]
clap = { version = "^4.6", features = ["derive"] }
color-eyre = "0.6.5"
humantime = "2.4.0"
itertools = "0.15.0"
log = "^0.4"
nix = { version = "0.31", features = ["user"] }
prettytable-rs = "^0.10"
r-lanlib = { path = "../lib", version = "0.12.0" }
serde_json.workspace = true
simplelog = { version = "^0.12", features = ["paris"] }

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3.27.0"
