[package]
name = "r-lanterm"
version = "0.12.0"
edition.workspace = true
description = "A full-featured terminal user interface (TUI) application for managing and interacting with networked LAN devices"
documentation = "https://docs.rs/r-lanterm"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "target/{ target }/release/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "^4.6", features = ["derive"] }
color-eyre = "0.6.5"
ctrlc = "3.5.2"
derive_builder = "0.20.2"
directories = "6.0"
dirs = "6.0.0"
fakeit = "1.4.1"
humantime = "2.4.0"
indoc = "2.0.7"
itertools = "0.15.0"
log = "^0.4"
nix = { version = "0.31", features = ["user"] }
r-lanlib = { path = "../lib", version = "0.12.0" }
ratatui = { version = "0.30.2", features = ["unstable-widget-ref"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
signal-hook = "0.4.4"
simplelog = { version = "^0.12", features = ["paris"] }
strum = { version = "0.28.0", features = ["derive"] }
supports-color = "3.0.2"
unicode-width = "0.2.2"
whoami = "2.1.3"

[dev-dependencies]
insta = "1.48.0"
mockall = "0.15.0"
nanoid = "0.5.0"
tempfile = "3.27.0"
